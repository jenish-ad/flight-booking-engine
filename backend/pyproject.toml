[project]
name = "backend"
version = "0.1.0"
description = "Flight Booking Engine Backend API"
readme = "README.md"

authors = [
    { name = "jenish-ad", email = "adhicary.jen@gmail.com" }
]

requires-python = ">=3.10"

dependencies = [
    "bcrypt<4.1",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.42",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
