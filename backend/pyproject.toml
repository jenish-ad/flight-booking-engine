[project]
name = "backend"
version = "0.1.0"
description = "Flight Booking Engine Backend API"
readme = "README.md"

authors = [
    { name = "jenish-ad", email = "adhicary.jen@gmail.com" }
]

requires-python = ">=3.10"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
