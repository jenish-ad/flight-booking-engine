# Install the Git hook once from the repository root:
#   uv run --project Backend python -m pre_commit install
# Run the hooks manually against all tracked files:
#   uv run --project Backend python -m pre_commit run --all-files
# On a normal commit, pre-commit checks the files staged for that commit.
repos:
  # "local" means these hook commands are defined here, rather than downloaded
  # from a separate hook repository.
  - repo: local
    hooks:
      # id identifies the hook; name is the label printed when it runs.
      - id: ruff-check
        name: ruff check
        # uv selects Backend's environment; python -m runs Ruff as a module.
        # --fix applies available safe lint fixes. Review and stage any edits,
        # then commit again if pre-commit reports that files were modified.
        entry: uv run --project Backend python -m ruff check --fix
        # Use installed tools instead of having pre-commit create an environment.
        # Install backend/frontend dependencies before running these hooks.
        language: system
        # types and files both apply: this hook receives matching Python files.
        types: [python]
        # files is a case-sensitive regular expression. ^ means path start.
        # Backend/ must match the tracked directory's capitalization exactly.
        files: ^Backend/

      # Apply consistent Python formatting to matching files.
      - id: ruff-format
        name: ruff format
        entry: uv run --project Backend python -m ruff format
        language: system
        types: [python]
        files: ^Backend/

      # Run the complete backend test suite whenever a Backend file matches.
      - id: pytest
        name: pytest
        entry: uv run --project Backend python -m pytest Backend/tests
        language: system
        # Do not append staged filenames: pytest already receives Backend/tests.
        # This runs the full suite even if only one backend file was staged.
        pass_filenames: false
        files: ^Backend/

      # --prefix tells npm which project's package.json/scripts to use.
      # "lint" is the script defined in Frontend/package.json.
      - id: eslint
        name: eslint
        entry: npm --prefix Frontend run lint
        language: system
        # The lint script checks the project; it does not need staged filenames.
        pass_filenames: false
        # \. matches a literal dot; (a|b) selects extensions; $ means path end.
        files: ^Frontend/.*\.(js|jsx|ts|tsx|mjs)$

      # Check frontend TypeScript without generating JavaScript output.
      - id: tsc
        name: tsc
        # Generate Next.js route helpers and image declarations before tsc.
        # A fresh checkout has neither .next/types nor next-env.d.ts yet.
        entry: npm --prefix Frontend run typecheck
        language: system
        # Type errors can span files, so check the project as a whole.
        pass_filenames: false
        files: ^Frontend/.*\.(ts|tsx)$
